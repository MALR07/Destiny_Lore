[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

  [dev]
    host = "0.0.0.0"
    port = 8888
    autoLaunch = false

  [[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
